# Packaging de l'application de bureau :
#   macOS   : ./release/build.sh      (ou npm run dist:mac)
#   Windows : ./release/build-win.sh  (ou npm run dist:win)
appId: io.github.warnonphilippe.consomazout
productName: ConsoMazout
artifactName: consomazout-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# esbuild embarque déjà tout le front dans dist/ ; seule la dépendance du process principal
# (@anthropic-ai/sdk) est empaquetée. Angular, Chart.js… sont en devDependencies.
files:
  - dist/consomazout/browser/**/*
  - dist-electron/**/*.js
  - package.json
asar: true
# Aucun module natif à recompiler pour Electron.
npmRebuild: false

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.lifestyle
  icon: build/icon.icns
  # Par défaut : signature ad hoc, indispensable pour qu'une app arm64 se lance. Sur un autre Mac, lever la
  # quarantaine (voir le guide). release/build.sh signe plutôt avec le certificat « Apple Development » du
  # trousseau quand il existe : une identité stable garde l'accès au Trousseau (clé API) d'une version à l'autre.
  identity: '-'
  hardenedRuntime: false

dmg:
  title: ConsoMazout ${version}

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # Pas de certificat de signature de code : Windows SmartScreen affichera un avertissement (voir le guide).
  signAndEditExecutable: true

nsis:
  # Installation par utilisateur, sans droits administrateur.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ConsoMazout
