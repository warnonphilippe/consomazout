# Packaging de l'application de bureau :
#   macOS   : ./release/build.sh      (ou npm run dist:mac)
#   Windows : ./release/build-win.sh  (ou npm run dist:win)
appId: io.github.warnonphilippe.consomazout
productName: ConsoMazout
artifactName: consomazout-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# esbuild embarque déjà tout le front dans dist/ ; seules les dépendances du process principal
# (@anthropic-ai/sdk, openai, node-llama-cpp) sont empaquetées. Angular, Chart.js… sont en devDependencies.
files:
  - dist/consomazout/browser/**/*
  - dist-electron/**/*.js
  - package.json
  # Moteur llama.cpp (modèles open source locaux) : seuls les binaires précompilés de la plateforme cible.
  # Les sources de llama.cpp (compilation locale, jamais utilisée) et les variantes CUDA (très lourdes)
  # sont exclues ; Metal (Mac) et Vulkan/CPU (Windows) suffisent.
  - '!node_modules/node-llama-cpp/llama/gitRelease.bundle'
  - '!node_modules/node-llama-cpp/bins/**/*'
  - node_modules/node-llama-cpp/bins/${os}-${arch}*/**/*
  - '!node_modules/node-llama-cpp/llama/localBuilds/**/*'
  - '!node_modules/@node-llama-cpp/*/bins/**/*'
  - node_modules/@node-llama-cpp/${os}-${arch}*/bins/**/*
  - '!node_modules/@node-llama-cpp/*cuda*/**/*'
asar: true
# Les bibliothèques natives de llama.cpp doivent rester hors de l'archive asar pour être chargées.
asarUnpack:
  - node_modules/node-llama-cpp/bins
  - node_modules/@node-llama-cpp/*
# Binaires N-API précompilés (node-llama-cpp) : rien à recompiler pour Electron.
npmRebuild: false

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.lifestyle
  icon: build/icon.icns
  # Par défaut : signature ad hoc, indispensable pour qu'une app arm64 se lance. Sur un autre Mac, lever la
  # quarantaine (voir le guide). release/build.sh signe plutôt avec le certificat « Apple Development » du
  # trousseau quand il existe. Les clés API sont dans le Trousseau par l'outil `security` : elles ne dépendent pas de
  # la signature de l'application.
  identity: '-'
  hardenedRuntime: false

dmg:
  title: ConsoMazout ${version}

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # Pas de certificat de signature de code : Windows SmartScreen affichera un avertissement (voir le guide).
  signAndEditExecutable: true

nsis:
  # Installation par utilisateur, sans droits administrateur.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ConsoMazout
